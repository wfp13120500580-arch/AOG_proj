<!DOCTYPE html>

<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Microsoft YaHei",Inter,system-ui,sans-serif;background:#eef2f6;color:#1f2937}.app{height:100%;display:grid;grid-template-columns:250px minmax(0,1fr) 420px;overflow:hidden}.task-side{background:#f8fafc;border-right:1px solid #dfe5eb;display:flex;flex-direction:column}.side-head{height:58px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e2e7ec;background:#fff}.side-title{font-size:14px;font-weight:700;color:#223f5c}.side-count{font-size:10px;color:#91a0ad}.task-list{overflow:auto;padding:8px}.task-item{background:#fff;border:1px solid #e5e9ee;border-radius:8px;padding:11px;margin-bottom:8px;cursor:pointer;transition:.15s}.task-item:hover{border-color:#b6d4ec}.task-item.active{border-color:#4a9ed8;background:#eef7ff;box-shadow:inset 3px 0 0 #378fca}.task-row{display:flex;justify-content:space-between;gap:8px}.task-id{font-size:11px;font-weight:700;color:#2f506e}.task-lv{font-size:9px;color:#b65b5b}.task-fault{font-size:10px;color:#677a8c;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-meta{display:flex;justify-content:space-between;font-size:9px;color:#99a5af;margin-top:7px}.task-node{font-size:9px;color:#66849c;margin-top:6px;padding-top:6px;border-top:1px dashed #edf0f3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{min-width:0;display:flex;flex-direction:column;padding:12px;gap:10px;overflow:hidden}.task-bar{background:linear-gradient(135deg,#143c60,#285e86);border-radius:9px;color:#fff;padding:13px 15px;display:flex;align-items:center;justify-content:space-between;gap:16px}.task-main strong{font-size:14px}.task-main span{display:block;font-size:10px;color:rgba(255,255,255,.66);margin-top:4px}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;flex:1;max-width:620px}.fact label{display:block;font-size:9px;color:rgba(255,255,255,.55)}.fact b{display:block;font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stage-card,.solution-card{background:#fff;border:1px solid #e2e7ec;border-radius:9px;overflow:hidden}.card-head{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;border-bottom:1px solid #edf0f3}.card-head strong{font-size:12px;color:#2d4b66}.card-head span{font-size:9px;color:#8f9ca8}.stage-list{padding:6px 12px}.stage{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:9px 4px;border-bottom:1px solid #f0f2f4}.stage:last-child{border:0}.stage-dot{width:9px;height:9px;border-radius:50%;background:#cdd5dc}.stage.done .stage-dot{background:#42a66d}.stage.current .stage-dot{background:#3b82c4;box-shadow:0 0 0 4px rgba(59,130,196,.12)}.stage-title{font-size:11px;font-weight:600;color:#36516a}.stage-desc{font-size:9px;color:#98a3ae;margin-top:2px}.stage-state{font-size:9px;color:#9aa6b0}.stage.current .stage-state{color:#2d83bd}.stage.done .stage-state{color:#42a66d}.solution-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}.sol{border:1px solid #e7ebef;border-radius:8px;padding:11px}.sol.recommended{border-color:#91c9a6;background:#f8fffb}.sol-top{display:flex;justify-content:space-between}.sol-name{font-size:11px;font-weight:700;color:#31536f}.sol-tag{font-size:8px;padding:2px 6px;border-radius:8px;background:#edf2f7;color:#7d8b98}.sol.recommended .sol-tag{background:#dcfce7;color:#166534}.sol-row{display:flex;justify-content:space-between;font-size:9px;padding-top:7px}.sol-row span{color:#99a5af}.sol-row b{color:#40586d}.note{margin-top:auto;background:#fff;border:1px dashed #cbd8e4;border-radius:8px;padding:10px 12px;font-size:10px;color:#708395;line-height:1.6}.agent{padding:10px 10px 10px 0;min-width:0}.chat{height:100%;background:#fff;border:1px solid #dfe5eb;border-radius:10px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 2px 8px rgba(15,23,42,.04)}.chat-head{height:58px;padding:0 13px;border-bottom:1px solid #edf0f3;display:flex;align-items:center;justify-content:space-between;background:#fbfcfd}.agent-title{display:flex;align-items:center;gap:8px}.agent-icon{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#173b63,#2f76ad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}.agent-name{font-size:12px;font-weight:700;color:#2a4863}.agent-status{font-size:9px;color:#2f9a5f;margin-top:2px}.head-actions{display:flex;gap:5px}.icon-btn{width:30px;height:30px;border:1px solid #e3e8ed;background:#fff;border-radius:6px;cursor:pointer;color:#6f8191}.icon-btn:hover{background:#f3f7fa}.context{padding:8px 10px;border-bottom:1px solid #eff2f5;background:#f8fafc}.context-line{display:flex;align-items:center;justify-content:space-between;gap:8px}.context-title{font-size:9px;color:#93a0ac}.context-id{font-size:9px;font-weight:700;color:#3a6282}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.chip{font-size:8px;color:#52718b;background:#fff;border:1px solid #e0e7ed;border-radius:10px;padding:2px 6px}.quick{display:flex;gap:5px;padding:7px 9px;border-bottom:1px solid #f0f2f4;overflow-x:auto;scrollbar-width:none}.quick::-webkit-scrollbar{display:none}.quick button{flex:0 0 auto;border:1px solid #dce8f1;background:#f7fbfe;color:#3979a8;border-radius:12px;padding:4px 8px;font-size:9px;cursor:pointer}.quick button:hover{background:#eaf5fd}.messages{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px;background:#fff}.message{display:flex;gap:7px;max-width:92%}.message.user{align-self:flex-end;flex-direction:row-reverse}.avatar{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex:0 0 auto}.assistant .avatar{background:#e9f2fb;color:#286b9b}.user .avatar{background:#173b63;color:#fff}.bubble-wrap{min-width:0}.bubble{font-size:10px;line-height:1.65;padding:8px 10px;border-radius:9px;word-break:break-word}.assistant .bubble{background:#f5f7f9;color:#374151;border-top-left-radius:3px}.user .bubble{background:#eaf4ff;color:#24445f;border-top-right-radius:3px}.msg-meta{font-size:8px;color:#b1bac3;margin-top:3px}.user .msg-meta{text-align:right}.assistant-tools{display:flex;gap:4px;margin-top:4px}.tiny-btn{border:0;background:transparent;color:#9aa6b0;font-size:8px;cursor:pointer;padding:2px 4px}.tiny-btn:hover{color:#3a7da8}.typing{display:flex;align-items:center;gap:3px;height:14px}.typing i{width:4px;height:4px;background:#7f9ab0;border-radius:50%;animation:typing 1.2s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-3px);opacity:1}}.action-card{margin-top:7px;background:#fff;border:1px solid #dbe5ec;border-radius:7px;padding:8px}.action-card-title{font-size:9px;font-weight:700;color:#315873}.action-card-desc{font-size:8px;color:#8997a3;margin-top:3px;line-height:1.5}.action-buttons{display:flex;gap:5px;margin-top:7px}.action-buttons button{border:1px solid #bad4e7;background:#eef8ff;color:#2c79ac;border-radius:5px;padding:4px 7px;font-size:8px;cursor:pointer}.action-buttons button.primary{background:#247fb9;color:#fff;border-color:#247fb9}.composer{border-top:1px solid #edf0f3;padding:8px 9px;background:#fbfcfd}.attach-row{display:flex;gap:5px;margin-bottom:6px;min-height:20px}.attach-chip{font-size:8px;background:#eef4f8;color:#557289;border:1px solid #dce6ed;border-radius:5px;padding:3px 6px}.input-row{display:flex;align-items:flex-end;gap:6px}.composer textarea{flex:1;resize:none;min-height:38px;max-height:100px;border:1px solid #dfe5eb;border-radius:8px;padding:8px 9px;font:inherit;font-size:10px;line-height:1.5;outline:none;background:#fff}.composer textarea:focus{border-color:#69a7d0;box-shadow:0 0 0 2px rgba(105,167,208,.1)}.attach-btn,.send-btn{width:38px;height:38px;border-radius:8px;cursor:pointer}.attach-btn{border:1px solid #dfe5eb;background:#fff;color:#6d8192}.send-btn{border:0;background:#1d608f;color:#fff;font-size:15px}.send-btn:disabled{background:#a9b8c3;cursor:not-allowed}.composer-tip{font-size:8px;color:#a1adb7;margin-top:5px;text-align:right}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:#1f2937;color:#fff;padding:8px 12px;border-radius:6px;font-size:10px;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:1200px){.app{grid-template-columns:220px minmax(0,1fr) 360px}.facts{gap:7px}.solution-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="task-side">
    <div class="side-head"><div class="side-title">AOG任务</div><div class="side-count" id="taskCount"></div></div>
    <div class="task-list" id="taskList"></div>
  </aside>

  <main class="main">
    <section class="task-bar">
      <div class="task-main"><strong id="barTitle"></strong><span id="barSub"></span></div>
      <div class="facts" id="facts"></div>
    </section>

    <section class="stage-card">
      <div class="card-head"><strong>保障流程进度</strong><span id="progressText"></span></div>
      <div class="stage-list" id="stageList"></div>
    </section>

    <section class="solution-card">
      <div class="card-head"><strong>当前保障方案</strong><span>Agent 可通过自然语言直接修改</span></div>
      <div class="solution-grid" id="solutionGrid"></div>
    </section>
    <div class="note">Demo说明：右侧对话无需后端即可运行。支持连续对话、快捷指令、任务上下文切换、方案字段修改、节点完成、风险检查、下一步建议、通报生成、复制、重新生成、附件占位及每个任务独立会话历史。</div>
  </main>

  <aside class="agent">
    <section class="chat">
      <header class="chat-head">
        <div class="agent-title"><div class="agent-icon">AI</div><div><div class="agent-name">AOG 保障 Agent</div><div class="agent-status">● 在线 · Demo 模式</div></div></div>
        <div class="head-actions"><button class="icon-btn" id="newChatBtn" title="新建会话">＋</button><button class="icon-btn" id="clearBtn" title="清空当前会话">⌫</button></div>
      </header>
      <div class="context"><div class="context-line"><span class="context-title">当前任务上下文</span><span class="context-id" id="contextId"></span></div><div class="chips" id="contextChips"></div></div>
      <div class="quick" id="quickActions"></div>
      <div class="messages" id="messages"></div>
      <div class="composer">
        <div class="attach-row" id="attachRow"></div>
        <div class="input-row"><button class="attach-btn" id="attachBtn" title="添加附件">＋</button><textarea id="chatInput" rows="1" placeholder="输入指令，例如：方案1运输方式改为空运，ETA改为7月7日18:30"></textarea><button class="send-btn" id="sendBtn" title="发送">➤</button></div>
        <div class="composer-tip">Enter 发送 · Shift+Enter 换行</div>
        <input id="fileInput" type="file" hidden multiple />
      </div>
    </section>
  </aside>
</div>
<div class="toast" id="toast"></div>
<script>
const tasks=[
 {id:'AOG-2026-0706-001',reg:'B-8321',flight:'HO1234',level:1,airport:'上海浦东',iata:'PVG',fault:'雷达罩前缘分层损伤',partNo:'P/N 700-001-01',neededBy:'7月7日 20:00',nextFlight:'HO1235 · 7月7日 22:30',status:'进行中',currentNode:'询件',risk:'高',stages:[['询件','current','向当地航司、KLM、汉莎、IATP同步询件'],['运输方案','pending','等待锁定器材来源后生成'],['确认合同','pending','等待商务条款确认'],['运输进度监控','pending','等待航材发运'],['收尾','pending','等待保障完成']],solutions:[{id:'S1',provider:'KLM',origin:'阿姆斯特丹 AMS',qty:'1EA',transport:'待确认',eta:'待确认',recommended:true},{id:'S2',provider:'汉莎',origin:'法兰克福 FRA',qty:'1EA',transport:'待确认',eta:'待确认',recommended:false}]},
 {id:'AOG-2026-0706-002',reg:'B-8156',flight:'HO1887',level:2,airport:'上海虹桥',iata:'SHA',fault:'发动机引气超温',partNo:'P/N CFM56-7B-001',neededBy:'7月7日 06:00',nextFlight:'HO1888 · 7月7日 08:15',status:'进行中',currentNode:'运输方案',risk:'中',stages:[['询件','done','虹桥仓库已确认有件'],['运输方案','current','同城调配方案确认中'],['确认合同','pending','内部调拨无需外部合同'],['运输进度监控','pending','等待车辆出发'],['收尾','pending','等待保障完成']],solutions:[{id:'S1',provider:'虹桥仓库',origin:'SHA航材库',qty:'1EA',transport:'同城专车',eta:'7月6日 12:40',recommended:true},{id:'S2',provider:'浦东仓库',origin:'PVG航材库',qty:'1EA',transport:'备选调拨',eta:'7月6日 14:20',recommended:false}]},
 {id:'AOG-2026-0705-003',reg:'B-8267',flight:'HO2310',level:2,airport:'新加坡樟宜',iata:'SIN',fault:'APU故障',partNo:'P/N APS3200-001',neededBy:'7月7日 23:00',nextFlight:'HO2311 · 7月8日 01:30',status:'进行中',currentNode:'运输进度监控',risk:'高',stages:[['询件','done','新加坡支援件已确认'],['运输方案','done','航空货运方案已锁定'],['确认合同','done','支援合同已生效'],['运输进度监控','current','等待进口清关'],['收尾','pending','等待航材到位']],solutions:[{id:'S1',provider:'汉莎新加坡',origin:'SIN机场仓库',qty:'1EA',transport:'机场内转运',eta:'7月6日 17:30',recommended:true},{id:'S2',provider:'国泰',origin:'香港 HKG',qty:'1EA',transport:'CX航班货运',eta:'7月7日 08:10',recommended:false}]}
];
let currentTaskId=localStorage.getItem('aog-demo-task')||tasks[0].id;let loading=false;let attachments=[];let lastUserText='';
const $=id=>document.getElementById(id);const clone=o=>JSON.parse(JSON.stringify(o));
let state=JSON.parse(localStorage.getItem('aog-demo-state')||'null')||{};tasks.forEach(t=>{if(!state[t.id])state[t.id]={task:clone(t),messages:[]};});
function save(){localStorage.setItem('aog-demo-state',JSON.stringify(state));localStorage.setItem('aog-demo-task',currentTaskId)}
function task(){return state[currentTaskId].task}function messages(){return state[currentTaskId].messages}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function now(){return new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1600)}
function renderAll(){renderTasks();renderMain();renderContext();renderMessages();renderQuick();save()}
function renderTasks(){$('taskCount').textContent=tasks.length+' 个任务';$('taskList').innerHTML=tasks.map(base=>{const t=state[base.id].task;return `<div class="task-item ${t.id===currentTaskId?'active':''}" data-task="${t.id}"><div class="task-row"><span class="task-id">${t.id}</span><span class="task-lv">Lv${t.level}</span></div><div class="task-fault">${esc(t.fault)}</div><div class="task-meta"><span>${esc(t.airport)} · ${t.iata}</span><span>${t.status}</span></div><div class="task-node">当前：${esc(t.currentNode)}</div></div>`}).join('');document.querySelectorAll('[data-task]').forEach(el=>el.onclick=()=>switchTask(el.dataset.task))}
function renderMain(){const t=task();$('barTitle').textContent=`${t.id} · ${t.reg}`;$('barSub').textContent=`${t.fault} · ${t.partNo}`;$('facts').innerHTML=[['AOG等级','Lv'+t.level],['AOG地点',`${t.airport}（${t.iata}）`],['需求时间',t.neededBy],['下个航班',t.nextFlight]].map(x=>`<div class="fact"><label>${x[0]}</label><b>${esc(x[1])}</b></div>`).join('');const done=t.stages.filter(x=>x[1]==='done').length;$('progressText').textContent=`${done}/${t.stages.length} 完成`;$('stageList').innerHTML=t.stages.map((s,i)=>`<div class="stage ${s[1]}"><div class="stage-dot"></div><div><div class="stage-title">${i+1}. ${esc(s[0])}</div><div class="stage-desc">${esc(s[2])}</div></div><div class="stage-state">${s[1]==='done'?'已完成':s[1]==='current'?'进行中':'待处理'}</div></div>`).join('');$('solutionGrid').innerHTML=t.solutions.map(s=>`<div class="sol ${s.recommended?'recommended':''}"><div class="sol-top"><span class="sol-name">${s.id} · ${esc(s.provider)}</span><span class="sol-tag">${s.recommended?'推荐':'备选'}</span></div><div class="sol-row"><span>来源</span><b>${esc(s.origin)}</b></div><div class="sol-row"><span>数量</span><b>${esc(s.qty)}</b></div><div class="sol-row"><span>运输方式</span><b>${esc(s.transport)}</b></div><div class="sol-row"><span>预计到达</span><b>${esc(s.eta)}</b></div></div>`).join('')}
function renderContext(){const t=task();$('contextId').textContent=t.id;$('contextChips').innerHTML=[t.reg,`Lv${t.level}`,`${t.airport} ${t.iata}`,t.currentNode,t.risk+'风险'].map(x=>`<span class="chip">${esc(x)}</span>`).join('')}
function renderQuick(){const arr=['任务摘要','风险检查','下一步建议','生成保障方案','生成进展通报'];$('quickActions').innerHTML=arr.map(x=>`<button data-q="${x}">${x}</button>`).join('');document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>submit(b.dataset.q))}
function welcome(){const t=task();return `我已接入当前任务 <b>${t.id}</b> 的上下文。<br>你可以直接问进展、风险、下一步，也可以让我修改方案，例如：<br>• “方案1运输方式改为空运”<br>• “方案1 ETA 改为7月7日18:30”<br>• “方案2供应商改为国泰”<br>• “把${t.currentNode}标记完成”`}
function renderMessages(){const box=$('messages');if(messages().length===0){messages().push({role:'assistant',html:welcome(),time:now()});save()}box.innerHTML=messages().map((m,i)=>`<div class="message ${m.role}"><div class="avatar">${m.role==='assistant'?'AI':'我'}</div><div class="bubble-wrap"><div class="bubble">${m.html||esc(m.text||'').replace(/\n/g,'<br>')}</div><div class="msg-meta">${m.time||''}</div>${m.role==='assistant'?`<div class="assistant-tools"><button class="tiny-btn" data-copy="${i}">复制</button><button class="tiny-btn" data-retry="${i}">重新生成</button></div>`:''}</div></div>`).join('');if(loading)box.insertAdjacentHTML('beforeend','<div class="message assistant"><div class="avatar">AI</div><div class="bubble-wrap"><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div></div>');box.scrollTop=box.scrollHeight;document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyMessage(+b.dataset.copy));document.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>retryMessage(+b.dataset.retry));bindActionButtons()}
function switchTask(id){currentTaskId=id;attachments=[];$('attachRow').innerHTML='';renderAll()}
function push(role,obj){messages().push({role,time:now(),...obj});save();renderMessages()}
function submit(raw){const q=(raw??$('chatInput').value).trim();if(!q||loading)return;lastUserText=q;push('user',{text:q});$('chatInput').value='';autoResize();attachments=[];$('attachRow').innerHTML='';loading=true;renderMessages();setTimeout(()=>{const reply=agentReply(q);loading=false;push('assistant',reply);renderAll()},550+Math.random()*450)}
function getSolIndex(q){const m=q.match(/方案\s*([1-9])/);return m?Number(m[1])-1:-1}
function updateSolution(q){const t=task();const idx=getSolIndex(q);if(idx<0||!t.solutions[idx])return null;const s=t.solutions[idx];let changes=[];let m=q.match(/数量(?:改为|改成|=|：|:)?\s*(\d+)\s*(EA|件|个)?/i);if(m){s.qty=m[1]+(m[2]||'EA');changes.push(`数量 → ${s.qty}`)}m=q.match(/(?:供应商|支援方)(?:改为|改成|=|：|:)?\s*([^，,。]+?)(?=\s*(?:，|,|。|$|发货地|运输方式|运输|ETA|预计))/i);if(m){s.provider=m[1].trim();changes.push(`供应商 → ${s.provider}`)}m=q.match(/(?:发货地|来源)(?:改为|改成|=|：|:)?\s*([^，,。]+?)(?=\s*(?:，|,|。|$|运输方式|运输|ETA|预计))/i);if(m){s.origin=m[1].trim();changes.push(`来源 → ${s.origin}`)}m=q.match(/(?:运输方式|运输)(?:改为|改成|=|：|:)?\s*([^，,。]+?)(?=\s*(?:，|,|。|$|ETA|预计到达|预计抵达))/i);if(m){s.transport=m[1].trim();changes.push(`运输方式 → ${s.transport}`)}m=q.match(/(?:ETA|预计到达|预计抵达)(?:时间)?(?:改为|改成|=|：|:)?\s*([^，,。]+)$/i);if(m){s.eta=m[1].trim();changes.push(`ETA → ${s.eta}`)}if(!changes.length)return null;save();return {html:`已更新 <b>${s.id}</b>：${changes.map(esc).join('；')}。<div class="action-card"><div class="action-card-title">方案数据已同步</div><div class="action-card-desc">左侧“当前保障方案”已实时刷新，可继续在对话中修改其他字段。</div><div class="action-buttons"><button data-act="summary">查看任务摘要</button><button class="primary" data-act="risk">重新检查风险</button></div></div>`}}
function completeStage(q){const t=task();let target=t.stages.findIndex(s=>q.includes(s[0])&&(q.includes('完成')||q.includes('标记')));if(target<0)return null;t.stages[target][1]='done';const next=t.stages.findIndex((s,i)=>i>target&&s[1]!=='done');if(next>=0){t.stages[next][1]='current';t.currentNode=t.stages[next][0]}else{t.currentNode='收尾';t.status='已完成'}save();return {html:`已将 <b>${esc(t.stages[target][0])}</b> 标记为完成。${next>=0?`当前流程已推进到 <b>${esc(t.currentNode)}</b>。`:'该任务全部阶段已完成。'}<div class="action-card"><div class="action-card-title">流程状态已更新</div><div class="action-card-desc">任务主界面的进度、当前节点和右侧上下文已同步刷新。</div></div>`}}
function summaryHtml(){const t=task(),done=t.stages.filter(s=>s[1]==='done').length,rec=t.solutions.find(s=>s.recommended)||t.solutions[0];return `<b>${t.id} 当前摘要</b><br>• 机号/航班：${esc(t.reg)} / ${esc(t.flight)}<br>• 故障：${esc(t.fault)}<br>• AOG：Lv${t.level}，${esc(t.risk)}风险<br>• 当前节点：<b>${esc(t.currentNode)}</b>（${done}/${t.stages.length} 完成）<br>• 推荐方案：${esc(rec.provider)}，${esc(rec.transport)}，ETA ${esc(rec.eta)}<br>• 需求时限：${esc(t.neededBy)}`}
function riskHtml(){const t=task();let risks=[];const rec=t.solutions.find(s=>s.recommended)||t.solutions[0];if(rec.transport==='待确认')risks.push('推荐方案运输方式尚未锁定');if(rec.eta==='待确认')risks.push('推荐方案 ETA 尚未确认');if(t.level<=2)risks.push(`当前为 AOG Lv${t.level}，需保持备份方案并持续跟踪`);if(t.currentNode==='运输进度监控')risks.push('在途阶段需要盯紧清关、转运和末端交接节点');if(!risks.length)risks.push('暂未发现阻断性风险，继续按当前方案推进');return `<b>风险检查结果</b><br>${risks.map((r,i)=>`${i+1}. ${esc(r)}`).join('<br>')}<div class="action-card"><div class="action-card-title">建议动作</div><div class="action-card-desc">优先补齐会影响保障时限的未确认字段，并保持备选方案可切换。</div><div class="action-buttons"><button data-act="next">给我下一步</button><button class="primary" data-act="plan">生成保障方案</button></div></div>`}
function nextHtml(){const t=task();const map={询件:'尽快锁定至少 1 个主来源 + 1 个备选来源，并确认可供数量、证书、放件时间和取件地址。',运输方案:'确认器材尺寸/重量/危险品属性，锁定运输方式、承运人、ETD/ETA、报关责任方。',确认合同:'完成支援价格、交换/借件条款及 SAP 合同确认，确保支援方可正式放件。',运输进度监控:'持续跟踪提货、出发、航班/陆运、清关、末端派送，并在关键节点通报。',收尾:'完成 SAP 收发料、归还方案、最终通报及复盘资料归档。'};return `<b>下一步建议：${esc(t.currentNode)}</b><br>${esc(map[t.currentNode]||'继续执行当前保障节点。')}<div class="action-card"><div class="action-card-title">可直接执行</div><div class="action-card-desc">完成后可直接对我说“把${esc(t.currentNode)}标记完成”，我会推进任务状态。</div></div>`}
function planHtml(){const t=task();const ordered=[...t.solutions].sort((a,b)=>Number(b.recommended)-Number(a.recommended));return `<b>当前保障方案建议</b><br>${ordered.map((s,i)=>`${i+1}. <b>${esc(s.id)} ${esc(s.provider)}</b> · ${esc(s.origin)} · ${esc(s.transport)} · ETA ${esc(s.eta)}${s.recommended?'（推荐）':''}`).join('<br>')}<br><br>决策建议：以推荐方案作为执行基准，保留另一方案作为备份；在 ETA 尚未确认时不建议关闭备选渠道。`}
function broadcastHtml(){const t=task(),rec=t.solutions.find(s=>s.recommended)||t.solutions[0];const text=`【AOG保障进展通报】\n任务：${t.id}\n机号/航班：${t.reg} / ${t.flight}\n故障：${t.fault}\nAOG等级：Lv${t.level}\n当前节点：${t.currentNode}\n推荐保障方案：${rec.provider} / ${rec.origin}\n运输方式：${rec.transport}\n预计到达：${rec.eta}\n需求时间：${t.neededBy}\n下个航班：${t.nextFlight}`;return `<b>已生成进展通报</b><div class="action-card"><div class="action-card-desc" style="white-space:pre-line;color:#4b5f70">${esc(text)}</div><div class="action-buttons"><button class="primary" data-copytext="${encodeURIComponent(text)}">复制通报</button></div></div>`}
function agentReply(q){const lower=q.toLowerCase();const updated=updateSolution(q);if(updated)return updated;const completed=completeStage(q);if(completed)return completed;if(q.includes('摘要')||q.includes('当前进展')||q.includes('现在什么情况'))return{html:summaryHtml()};if(q.includes('风险'))return{html:riskHtml()};if(q.includes('下一步')||q.includes('建议'))return{html:nextHtml()};if(q.includes('保障方案')||q.includes('方案推荐'))return{html:planHtml()};if(q.includes('通报')||q.includes('汇报'))return{html:broadcastHtml()};if(q.includes('你好')||q.includes('在吗'))return{html:'在。当前任务上下文已经加载，可以直接给我业务指令。'};if(lower.includes('eta')&&getSolIndex(q)<0)return{html:'可以修改 ETA。请指明具体方案，例如：<b>“方案1 ETA 改为7月7日18:30”</b>。'};return{html:`我理解你是在处理 <b>${esc(task().id)}</b>。当前 Demo 支持：任务摘要、风险检查、下一步建议、保障方案生成、通报生成，以及通过自然语言修改方案字段或推进流程。<br><br>例如可以输入：<b>“方案1运输方式改为空运，ETA改为7月7日18:30”</b>。`}}
function copyMessage(i){const m=messages()[i];const div=document.createElement('div');div.innerHTML=m.html||m.text||'';navigator.clipboard.writeText(div.innerText).then(()=>toast('已复制'))}
function retryMessage(i){let q='';for(let j=i-1;j>=0;j--){if(messages()[j].role==='user'){q=messages()[j].text;break}}if(!q)q=lastUserText;if(q)submit(q)}
function bindActionButtons(){document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const map={summary:'任务摘要',risk:'风险检查',next:'下一步建议',plan:'生成保障方案'};submit(map[b.dataset.act])});document.querySelectorAll('[data-copytext]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(decodeURIComponent(b.dataset.copytext)).then(()=>toast('通报已复制')))}
$('sendBtn').onclick=()=>submit();$('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}});$('chatInput').addEventListener('input',autoResize);function autoResize(){const el=$('chatInput');el.style.height='auto';el.style.height=Math.min(el.scrollHeight,100)+'px';$('sendBtn').disabled=!el.value.trim()||loading}
$('newChatBtn').onclick=()=>{state[currentTaskId].messages=[];save();renderMessages();toast('已新建当前任务会话')};$('clearBtn').onclick=()=>{if(confirm('清空当前任务的对话记录？')){state[currentTaskId].messages=[];save();renderMessages()}};
$('attachBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>{attachments=[...e.target.files].slice(0,3);$('attachRow').innerHTML=attachments.map(f=>`<span class="attach-chip">📎 ${esc(f.name)}</span>`).join('');if(attachments.length)toast('附件已加入本次消息（Demo占位）')};
renderAll();autoResize();
</script>
</body>
</html>
