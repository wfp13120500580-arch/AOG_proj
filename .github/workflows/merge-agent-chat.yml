name: Merge interactive Agent chat

on:
  push:
    paths:
      - '.github/workflows/merge-agent-chat.yml'

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch main workbench Agent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index_v3.0_minimal.html')
          s = p.read_text(encoding='utf-8')

          css = r'''
/* ===== Agent Chat v4 - interactive demo ===== */
.wb-agent-v3{padding:10px 10px 10px 0;min-width:0}
.wb-agent-v3 .agent-chat-panel{height:100%;border-radius:10px;border:1px solid #dfe5eb;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.04);display:flex;flex-direction:column;overflow:hidden}
.agent-chat-header-v4{height:58px;padding:0 12px;border-bottom:1px solid #edf0f3;display:flex;align-items:center;justify-content:space-between;background:#fbfcfd;flex:none}
.agent-chat-brand{display:flex;align-items:center;gap:8px}.agent-chat-avatar{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#173b63,#2f76ad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800}
.agent-chat-name{font-size:12px;font-weight:700;color:#2a4863}.agent-chat-online{font-size:9px;color:#2f9a5f;margin-top:2px}.agent-chat-head-actions{display:flex;gap:5px}.agent-chat-head-btn{width:29px;height:29px;border:1px solid #e2e7ec;background:#fff;border-radius:6px;cursor:pointer;color:#6f8191;font-size:13px}.agent-chat-head-btn:hover{background:#f2f6f9}
.agent-context-v4{padding:8px 10px;border-bottom:1px solid #eff2f5;background:#f8fafc;flex:none}.agent-context-line{display:flex;justify-content:space-between;align-items:center;gap:8px}.agent-context-label{font-size:9px;color:#93a0ac}.agent-context-id{font-size:9px;font-weight:700;color:#3a6282}.agent-context-chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.agent-context-chip{font-size:8px;color:#52718b;background:#fff;border:1px solid #e0e7ed;border-radius:10px;padding:2px 6px}
.agent-quick-v4{display:flex;gap:5px;padding:7px 8px;border-bottom:1px solid #f0f2f4;overflow-x:auto;scrollbar-width:none;flex:none}.agent-quick-v4::-webkit-scrollbar{display:none}.agent-quick-v4 button{flex:0 0 auto;border:1px solid #dce8f1;background:#f7fbfe;color:#3979a8;border-radius:12px;padding:4px 8px;font-size:9px;cursor:pointer}.agent-quick-v4 button:hover{background:#eaf5fd}
.agent-chat-messages-v4{flex:1;min-height:0;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px;background:#fff}.agent-msg-row{display:flex;gap:7px;max-width:94%;align-items:flex-start}.agent-msg-row.user{align-self:flex-end;flex-direction:row-reverse}.agent-msg-avatar{width:25px;height:25px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex:none}.agent-msg-row.assistant .agent-msg-avatar{background:#e9f2fb;color:#286b9b}.agent-msg-row.user .agent-msg-avatar{background:#173b63;color:#fff}.agent-msg-wrap{min-width:0}.agent-msg-bubble{font-size:10px;line-height:1.65;padding:8px 10px;border-radius:9px;word-break:break-word}.agent-msg-row.assistant .agent-msg-bubble{background:#f5f7f9;color:#374151;border-top-left-radius:3px}.agent-msg-row.user .agent-msg-bubble{background:#eaf4ff;color:#24445f;border-top-right-radius:3px}.agent-msg-meta{font-size:8px;color:#b1bac3;margin-top:3px}.agent-msg-row.user .agent-msg-meta{text-align:right}.agent-msg-stream{display:inline-flex;align-items:center;gap:3px;margin-left:5px}.agent-msg-stream i{width:4px;height:4px;background:#7f9ab0;border-radius:50%;animation:agentTyping 1.2s infinite}.agent-msg-stream i:nth-child(2){animation-delay:.15s}.agent-msg-stream i:nth-child(3){animation-delay:.3s}@keyframes agentTyping{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-3px);opacity:1}}
.agent-action-card{margin-top:7px;background:#fff;border:1px solid #dbe5ec;border-radius:7px;padding:8px}.agent-action-title{font-size:9px;font-weight:700;color:#315873}.agent-action-desc{font-size:8px;color:#8997a3;margin-top:3px;line-height:1.5}.agent-result-ok{color:#18864b;font-weight:600}
.agent-composer-v4{border-top:1px solid #edf0f3;padding:7px 8px 8px;background:#fbfcfd;flex:none}.agent-attachments{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:5px}.agent-attachment{font-size:8px;background:#eef4f8;color:#557289;border:1px solid #dce6ed;border-radius:5px;padding:3px 6px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.agent-input-row-v4{display:flex;align-items:flex-end;gap:5px}.agent-attach-btn,.agent-send-btn{width:36px;height:36px;border-radius:8px;cursor:pointer;flex:none}.agent-attach-btn{border:1px solid #dfe5eb;background:#fff;color:#6d8192}.agent-send-btn{border:0;background:#1d608f;color:#fff;font-size:14px}.agent-send-btn:disabled{background:#a9b8c3;cursor:not-allowed}.agent-input-v4{flex:1;resize:none;min-height:36px;max-height:86px;border:1px solid #dfe5eb;border-radius:8px;padding:8px 9px;font-family:inherit;font-size:10px;line-height:1.5;outline:none;background:#fff}.agent-input-v4:focus{border-color:#69a7d0;box-shadow:0 0 0 2px rgba(105,167,208,.1)}.agent-composer-tip{text-align:right;font-size:8px;color:#a1adb7;margin-top:4px}
'''
          if 'Agent Chat v4 - interactive demo' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          panel = r'''      <!-- 右侧：Agent -->
      <aside class="wb-agent-v3">
        <div class="agent-chat-panel">
          <div class="agent-chat-header-v4">
            <div class="agent-chat-brand">
              <div class="agent-chat-avatar">AI</div>
              <div><div class="agent-chat-name">AOG 保障 Agent</div><div class="agent-chat-online">● 在线 · {{ cfgApiKey ? 'AI增强模式' : 'Demo模式' }}</div></div>
            </div>
            <div class="agent-chat-head-actions"><button class="agent-chat-head-btn" @click="newAgentChat" title="新建会话">＋</button><button class="agent-chat-head-btn" @click="clearAgentChat" title="清空会话">⌫</button></div>
          </div>
          <div class="agent-context-v4">
            <div class="agent-context-line"><span class="agent-context-label">当前任务上下文</span><span class="agent-context-id">{{ wbTask.id }}</span></div>
            <div class="agent-context-chips"><span class="agent-context-chip">{{ wbTask.reg }}</span><span class="agent-context-chip">Lv{{ wbTask.aogLevel }}</span><span class="agent-context-chip">{{ wbTask.airportCN }} {{ wbTask.iataCode }}</span><span class="agent-context-chip">{{ activePhase ? activePhase.title : wbTask.currentNode }}</span><span class="agent-context-chip">{{ wbTask.priority }}</span></div>
          </div>
          <div class="agent-quick-v4">
            <button @click="sendAgentQuick('任务摘要')">任务摘要</button><button @click="sendAgentQuick('风险检查')">风险检查</button><button @click="sendAgentQuick('下一步建议')">下一步建议</button><button @click="sendAgentQuick('生成保障方案')">保障方案</button><button @click="sendAgentQuick('生成进展通报')">进展通报</button>
          </div>
          <div class="agent-chat-messages-v4" ref="agentChatScroll">
            <div v-for="(m,i) in agentChatMessages" :key="i" class="agent-msg-row" :class="m.role">
              <div class="agent-msg-avatar">{{ m.role==='assistant'?'AI':'我' }}</div>
              <div class="agent-msg-wrap"><div class="agent-msg-bubble"><span v-html="m.html||m.content"></span><span v-if="m.streaming" class="agent-msg-stream"><i></i><i></i><i></i></span></div><div class="agent-msg-meta">{{ m.time || '' }}</div></div>
            </div>
            <div v-if="agentChatMessages.length===0" class="wb-agent-empty">向保障 Agent 发送指令</div>
          </div>
          <div class="agent-composer-v4">
            <div class="agent-attachments" v-if="agentAttachments.length"><span class="agent-attachment" v-for="(f,i) in agentAttachments" :key="i">📎 {{ f.name }}</span></div>
            <div class="agent-input-row-v4"><button class="agent-attach-btn" @click="triggerAgentFile" title="添加附件">＋</button><textarea class="agent-input-v4" v-model="agentChatInput" rows="1" placeholder="输入指令，例如：方案1运输方式改为空运，ETA改为7月7日18:30" @keydown.enter.exact.prevent="sendAgentMessage" :disabled="agentChatLoading"></textarea><button class="agent-send-btn" @click="sendAgentMessage" :disabled="agentChatLoading||!agentChatInput.trim()">➤</button></div>
            <input id="agentFileInput" type="file" multiple style="display:none" @change="onAgentFiles"><div class="agent-composer-tip">Enter 发送 · Shift+Enter 换行</div>
          </div>
        </div>
      </aside>'''
          pattern = re.compile(r'      <!-- 右侧：Agent -->\s*<aside class="wb-agent-v3">.*?</aside>', re.S)
          s, n = pattern.subn(panel, s, count=1)
          if n != 1:
              raise SystemExit('Agent panel replacement failed')

          old_decl = "    const agentChatMessages = ref([]); const agentChatInput = ref(''); const agentChatLoading = ref(false);\n    const agentWelcomeShown = ref(false);"
          new_decl = "    const agentChatMessages = ref([]); const agentChatInput = ref(''); const agentChatLoading = ref(false);\n    const agentAttachments = ref([]); const agentChatSessions = reactive({}); const agentSessionTaskId = ref('');\n    const agentWelcomeShown = ref(false);"
          if old_decl in s:
              s = s.replace(old_decl, new_decl, 1)

          start = s.index('    function showAgentWelcome() {')
          end = s.index('    function parseSolIndex(text) {', start)
          helpers = r'''    function agentNow() { return new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}); }
    function agentScrollBottom() { nextTick(() => { const el = document.querySelector('.agent-chat-messages-v4'); if(el) el.scrollTop = el.scrollHeight; }); }
    function showAgentWelcome(force=false) {
      if (!wbTask.value) return;
      if (!force && agentChatMessages.value.length) return;
      const t = wbTask.value;
      agentWelcomeShown.value = true;
      agentChatMessages.value.push({role:'assistant',time:agentNow(),html:`已接入当前任务 <b>${t.id}</b> 的实时上下文。<br>你可以直接问进展、风险和下一步，也可以让我操作业务数据，例如：<br>• <b>方案1运输方式改为空运，ETA改为7月7日18:30</b><br>• <b>方案2供应商改为国泰</b><br>• <b>把询件标记完成</b>`,streaming:false});
      agentScrollBottom();
    }
    function saveAgentSession() {
      if (agentSessionTaskId.value) agentChatSessions[agentSessionTaskId.value] = JSON.parse(JSON.stringify(agentChatMessages.value));
    }
    function loadAgentSession(taskId) {
      agentSessionTaskId.value = taskId;
      agentChatMessages.value = agentChatSessions[taskId] ? JSON.parse(JSON.stringify(agentChatSessions[taskId])) : [];
      agentWelcomeShown.value = false;
      if (!agentChatMessages.value.length) showAgentWelcome(true);
    }
    function clearAgentChat() { if (!wbTask.value) return; agentChatMessages.value = []; agentChatSessions[wbTask.value.id] = []; showAgentWelcome(true); }
    function newAgentChat() { clearAgentChat(); ElementPlus.ElMessage.success('已新建当前任务会话'); }
    function sendAgentQuick(text) { agentChatInput.value = text; sendAgentMessage(); }
    function triggerAgentFile() { const el = document.getElementById('agentFileInput'); if (el) el.click(); }
    function onAgentFiles(e) { agentAttachments.value = Array.from(e.target.files || []).slice(0,3).map(f=>({name:f.name,size:f.size,type:f.type})); if(agentAttachments.value.length) ElementPlus.ElMessage.success(`已添加 ${agentAttachments.value.length} 个附件（Demo）`); e.target.value=''; }
    function escAgent(v) { return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c])); }
    function agentTaskSummary() {
      const t=wbTask.value; if(!t) return '';
      const done=wbPhases.value.reduce((n,p)=>n+wbPhaseDoneCnt(p),0), total=wbPhases.value.reduce((n,p)=>n+p.nodes.length,0);
      const rec=wbSolutions.value.find(s=>s.status==='active')||wbSolutions.value[0]||{};
      return `<b>${t.id} 当前摘要</b><br>• 机号/航班：${escAgent(t.reg)} / ${escAgent(t.flight)}<br>• 故障：${escAgent(t.faultType)} · ${escAgent(t.partNo)}<br>• AOG：Lv${t.aogLevel} · ${escAgent(t.priority)}<br>• 当前环节：<b>${escAgent(activePhase.value?.title||t.currentNode)}</b>（${done}/${total} 节点完成）<br>• 当前主方案：${escAgent(rec.provider||'待确认')} / ${escAgent(rec.transport||'待确认')} / ETA ${escAgent(rec.arriveTime||'待确认')}<br>• 需求时间：${escAgent(t.neededBy)}`;
    }
    function agentRiskCheck() {
      const t=wbTask.value; if(!t) return '';
      const rec=wbSolutions.value.find(s=>s.status==='active')||wbSolutions.value[0]||{}; const risks=[];
      if(!rec.transport || rec.transport==='待确认') risks.push('主方案运输方式尚未锁定');
      if(!rec.arriveTime || rec.arriveTime==='待确认') risks.push('主方案 ETA 尚未确认，无法判断是否满足需求时限');
      if(t.aogLevel<=2) risks.push(`当前为 AOG Lv${t.aogLevel}，需持续保留备份方案并升级关注`);
      if((activePhase.value?.title||'').includes('运输进度')) risks.push('在途阶段需重点盯紧提货、航班/陆运、清关与末端交接');
      if(!risks.length) risks.push('暂未识别阻断性风险，继续按当前方案推进');
      return `<b>风险检查结果</b><br>${risks.map((x,i)=>`${i+1}. ${escAgent(x)}`).join('<br>')}<div class="agent-action-card"><div class="agent-action-title">建议动作</div><div class="agent-action-desc">优先补齐影响保障时限的未确认字段，并保持备选方案可随时切换。</div></div>`;
    }
    function agentNextStep() {
      const title=activePhase.value?.title||wbTask.value?.currentNode||'';
      const map={询件:'锁定至少 1 个主来源 + 1 个备选来源，并确认数量、证书、放件时效和取件地址。',运输方案:'确认尺寸/重量/危险品属性，锁定运输方式、承运人、ETD/ETA、报关责任方。',确认合同:'完成价格、交换/借件条款和 SAP 合同确认，确保支援方可正式放件。',运输进度监控:'持续跟踪提货、出发、航班/陆运、清关、末端派送，并在关键节点更新通报。',收尾:'完成 SAP 收发料、器材归还、最终通报和复盘归档。'};
      return `<b>下一步建议：${escAgent(title)}</b><br>${escAgent(map[title]||'继续执行当前节点，并及时更新关键业务字段。')}<div class="agent-action-card"><div class="agent-action-title">可直接推进</div><div class="agent-action-desc">完成后直接告诉我“把${escAgent(title)}标记完成”，我会同步推进工作台流程。</div></div>`;
    }
    function agentPlanSummary() {
      if(!wbSolutions.value.length) return '当前还没有可用保障方案。';
      return `<b>当前保障方案</b><br>${wbSolutions.value.map((s,i)=>`${i+1}. <b>${escAgent(s.id)} ${escAgent(s.provider)}</b> · ${escAgent(s.origin)} · ${escAgent(s.transport)} · ETA ${escAgent(s.arriveTime)}${s.status==='active'?'（当前执行）':''}`).join('<br>')}<br><br>建议：主方案作为执行基准，同时保留至少一个备选方案，直到关键运输节点和 ETA 均确认。`;
    }
    function agentBroadcast() {
      const t=wbTask.value, rec=wbSolutions.value.find(s=>s.status==='active')||wbSolutions.value[0]||{};
      return `<b>【AOG保障进展通报】</b><br>任务：${escAgent(t.id)}<br>机号/航班：${escAgent(t.reg)} / ${escAgent(t.flight)}<br>故障：${escAgent(t.faultType)}<br>AOG等级：Lv${t.aogLevel}<br>当前环节：${escAgent(activePhase.value?.title||t.currentNode)}<br>主保障方案：${escAgent(rec.provider||'待确认')} / ${escAgent(rec.origin||'待确认')}<br>运输方式：${escAgent(rec.transport||'待确认')}<br>预计到达：${escAgent(rec.arriveTime||'待确认')}<br>需求时间：${escAgent(t.neededBy)}<br>下个航班：${escAgent(formatNextFlight(t.nextFlight))}`;
    }
    function tryAgentPhaseProgress(q) {
      if(!/(标记|设为|改为)?.*完成|完成.*(阶段|环节|节点)/.test(q)) return null;
      const idx=wbPhases.value.findIndex(p=>q.includes(p.title)); if(idx<0) return null;
      const p=wbPhases.value[idx]; markPhaseAllDone(p);
      const next=wbPhases.value[idx+1]; if(next){wbActivePhaseId.value=next.id; wbTask.value.currentNode=next.title;} else {wbTask.value.currentNode='收尾结案'; wbTask.value.status='已完成';}
      return `已将 <b>${escAgent(p.title)}</b> 标记完成。${next?`当前流程已推进到 <b>${escAgent(next.title)}</b>。`:'当前任务流程已全部完成。'}`;
    }
    function agentDemoReply(q) {
      const phaseResult=tryAgentPhaseProgress(q); if(phaseResult) return phaseResult;
      if(/摘要|当前进展|什么情况|现在情况/.test(q)) return agentTaskSummary();
      if(/风险/.test(q)) return agentRiskCheck();
      if(/下一步|建议/.test(q)) return agentNextStep();
      if(/保障方案|方案推荐/.test(q)) return agentPlanSummary();
      if(/通报|汇报/.test(q)) return agentBroadcast();
      if(/你好|在吗/.test(q)) return `在。当前已加载 <b>${escAgent(wbTask.value?.id)}</b>，可以直接给我业务指令。`;
      return null;
    }
'''
          s = s[:start] + helpers + s[end:]

          start = s.index('    async function sendAgentMessage() {')
          end = s.index('\n\n      // ===== 保障方案 =====', start)
          send_fn = r'''    async function sendAgentMessage() {
      const q = agentChatInput.value.trim(); if (!q || agentChatLoading.value) return;
      agentChatInput.value = '';
      agentChatMessages.value.push({role:'user',content:escAgent(q),time:agentNow()});
      const aiMsg = {role:'assistant',content:'',html:'',time:agentNow(),streaming:true}; agentChatMessages.value.push(aiMsg); agentChatLoading.value = true; agentScrollBottom();
      const localResult = tryLocalUpdate(q);
      if (localResult) {
        aiMsg.content = localResult; aiMsg.html = `<span class="agent-result-ok">${escAgent(localResult)}</span><div class="agent-action-card"><div class="agent-action-title">业务数据已同步</div><div class="agent-action-desc">工作台中的方案数据已经实时刷新，可继续修改其他字段或执行风险检查。</div></div>`;
        aiMsg.streaming = false; agentChatLoading.value = false; agentAttachments.value=[]; saveAgentSession(); agentScrollBottom(); initRecMap(); return;
      }
      const demo = agentDemoReply(q);
      if (demo) {
        setTimeout(()=>{aiMsg.html=demo; aiMsg.content=demo.replace(/<[^>]+>/g,' '); aiMsg.streaming=false; agentChatLoading.value=false; agentAttachments.value=[]; saveAgentSession(); agentScrollBottom(); initRecMap();},420);
        return;
      }
      if (!cfgApiKey.value) {
        setTimeout(()=>{aiMsg.html=`我已经理解当前任务上下文。这个 Demo 目前支持：<b>任务摘要、风险检查、下一步建议、保障方案、进展通报、方案字段修改、流程推进</b>。<br><br>例如输入：<b>“方案1运输方式改为空运，ETA改为7月7日18:30”</b>。`; aiMsg.content='Demo模式业务指令提示'; aiMsg.streaming=false; agentChatLoading.value=false; agentAttachments.value=[]; saveAgentSession(); agentScrollBottom();},420);
        return;
      }
      try {
        const msgs = agentChatMessages.value.filter(m => !m.streaming || m.content).map(m => ({role:m.role,content:(m.content||'').replace(/<[^>]+>/g,' ')})); msgs.pop();
        const base=(cfgApiBase.value||'https://api.openai.com/v1').replace(/\/$/,'');
        const resp = await fetch(base+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfgApiKey.value},body:JSON.stringify({model:cfgModel.value,messages:[...msgs,{role:'user',content:q}],stream:true})});
        if(!resp.ok) throw new Error('AI API '+resp.status);
        const reader = resp.body.getReader(), dec = new TextDecoder(); let buf = '';
        while(true){const{value,done} = await reader.read(); if(done) break; buf += dec.decode(value,{stream:true}); const lines=buf.split('\n'); buf=lines.pop()||''; for(const line of lines){if(!line.startsWith('data:')) continue; const d=line.slice(5).trim(); if(!d||d==='[DONE]') continue; try{const j=JSON.parse(d); const delta=j.choices?.[0]?.delta?.content; if(delta){aiMsg.content+=delta; aiMsg.html=renderMarkdown(aiMsg.content);}}catch(e){} } agentScrollBottom();}
        aiMsg.html = renderMarkdown(aiMsg.content); aiMsg.streaming = false;
      } catch(e) {
        aiMsg.content = 'AI增强接口暂不可用，已自动切回 Demo 交互。'; aiMsg.html = `<span style="color:#b45309">${aiMsg.content}</span><br>仍可继续使用方案修改、流程推进、风险检查等本地业务能力。`; aiMsg.streaming = false;
      }
      agentChatLoading.value = false; agentAttachments.value=[]; saveAgentSession(); agentScrollBottom();
    }
'''
          s = s[:start] + send_fn + s[end:]

          needle = "    function onWbTaskChange(taskId) {\n      wbTask.value = mockTasks.value.find(t => t.id === taskId) || null;"
          repl = "    function onWbTaskChange(taskId) {\n      saveAgentSession();\n      wbTask.value = mockTasks.value.find(t => t.id === taskId) || null;\n      loadAgentSession(taskId);"
          if needle not in s:
              raise SystemExit('Task switch patch failed')
          s = s.replace(needle, repl, 1)
          s = s.replace('        showAgentWelcome();\n', '', 1)

          ret_old = "      agentChatMessages, agentChatInput, agentChatLoading, sendAgentMessage,"
          ret_new = "      agentChatMessages, agentChatInput, agentChatLoading, agentAttachments, sendAgentMessage, sendAgentQuick, clearAgentChat, newAgentChat, triggerAgentFile, onAgentFiles,"
          if ret_old not in s:
              raise SystemExit('Return patch failed')
          s = s.replace(ret_old, ret_new, 1)

          p.write_text(s, encoding='utf-8')
          print('patched', p, len(s))
          PY

      - name: Commit patched main page
        shell: bash
        run: |
          git config user.name "AOG Demo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index_v3.0_minimal.html
          git diff --cached --quiet || git commit -m "feat: merge complete interactive Agent chat into main workbench"
          git push origin main
