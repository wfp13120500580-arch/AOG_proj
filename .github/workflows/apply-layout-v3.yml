name: Apply AOG layout v3

on:
  push:
    branches: [main]
    paths:
      - '.sync_script/layout_v3.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply layout v3
        shell: bash
        run: |
          set -euo pipefail
          python .sync_script/layout_v3.py
          grep -q 'AOG全球保障态势' index_v3.0_minimal.html
          grep -q 'wb-task-sidebar' index_v3.0_minimal.html
          grep -q 'phase-circle' index_v3.0_minimal.html
          grep -q 'screen-map' index_v3.0_minimal.html
          rm -rf .sync_script
          rm -f .github/workflows/apply-layout-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build AOG big-screen monitor and task workbench'
          git push
