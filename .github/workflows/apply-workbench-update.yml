name: Apply AOG workbench update

on:
  push:
    branches: [main]
    paths:
      - '.sync_script/apply.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified workbench update
        shell: bash
        run: |
          set -euo pipefail
          python .sync_script/apply.py
          actual=$(sha256sum index_v3.0_minimal.html | awk '{print $1}')
          expected='b67098b8beb8f66dad2c2181dc4d8bc2bc0afbe4389a256ac0549b6ee22ff907'
          if [ "$actual" != "$expected" ]; then
            echo "SHA256 mismatch: $actual"
            exit 1
          fi
          rm -rf .sync_script .sync_html .sync_payload
          rm -f .github/workflows/apply-workbench-update.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refactor AOG workbench flow'
          git push
