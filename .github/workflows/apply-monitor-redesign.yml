name: Apply monitor redesign

on:
  push:
    branches: [main]
    paths:
      - '.sync_script/monitor_redesign.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply monitor redesign
        shell: bash
        run: |
          set -euo pipefail
          python .sync_script/monitor_redesign.py
          grep -q 'AOG保障监控' index_v3.0_minimal.html
          grep -q 'monitor-summary' index_v3.0_minimal.html
          grep -q '任务监控详情' index_v3.0_minimal.html
          if grep -q '>系统概览</button>' index_v3.0_minimal.html; then
            echo 'System overview tab still exists'
            exit 1
          fi
          rm -rf .sync_script
          rm -f .github/workflows/apply-monitor-redesign.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Redesign AOG monitor dashboard'
          git push
