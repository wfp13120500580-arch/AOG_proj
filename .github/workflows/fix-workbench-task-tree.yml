name: Fix workbench task tree

on:
  push:
    branches: [main]
    paths:
      - '.sync_script/fix_workbench_tree.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply task tree fix
        shell: bash
        run: |
          set -euo pipefail
          python .sync_script/fix_workbench_tree.py
          grep -q 'wb-task-sidebar' index_v3.0_minimal.html
          grep -q 'enterWorkbench' index_v3.0_minimal.html
          if grep -q 'class="wb-selector"' index_v3.0_minimal.html; then
            echo 'legacy top task selector still exists'
            exit 1
          fi
          rm -rf .sync_script
          rm -f .github/workflows/fix-workbench-task-tree.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove legacy task selector and default workbench task'
          git push
