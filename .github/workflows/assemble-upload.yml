name: Assemble uploaded HTML

on:
  push:
    branches: [main]
    paths:
      - '.sync_parts/**'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble file when READY is present
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .sync_parts/READY ]; then
            echo "Upload still in progress; READY not present."
            exit 0
          fi
          : > index_v3.0_minimal.html
          for n in $(seq -w 2 15); do
            p=".sync_parts/part_${n}"
            test -f "$p" || { echo "Missing $p"; exit 1; }
            base64 -d "$p" >> index_v3.0_minimal.html
          done
          actual=$(sha256sum index_v3.0_minimal.html | awk '{print $1}')
          expected_sha='26e4c70755de503537487f9202ce9ff15d2aa77231b89eb74e0b73b71d9bafad'
          if [ "$actual" != "$expected_sha" ]; then
            echo "SHA256 mismatch: $actual"
            exit 1
          fi
          rm -rf .sync_parts
          rm -f .github/workflows/assemble-upload.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Sync index_v3.0_minimal.html'
          git push
