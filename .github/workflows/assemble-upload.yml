name: Assemble uploaded HTML

on:
  push:
    branches: [main]
    paths:
      - '.sync_parts/**'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble file when all parts are present
        shell: bash
        run: |
          set -euo pipefail
          expected=14
          count=$(find .sync_parts -maxdepth 1 -type f -name 'part_*' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" != "$expected" ]; then
            echo "Only $count/$expected parts present; nothing to assemble yet."
            exit 0
          fi
          : > index_v3.0_minimal.html
          for p in $(find .sync_parts -maxdepth 1 -type f -name 'part_*' | sort); do
            base64 -d "$p" >> index_v3.0_minimal.html
          done
          actual=$(sha256sum index_v3.0_minimal.html | awk '{print $1}')
          expected_sha='26e4c70755de503537487f9202ce9ff15d2aa77231b89eb74e0b73b71d9bafad'
          if [ "$actual" != "$expected_sha" ]; then
            echo "SHA256 mismatch: $actual"
            exit 1
          fi
          rm -rf .sync_parts
          rm -f .github/workflows/assemble-upload.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Sync index_v3.0_minimal.html'
          git push
