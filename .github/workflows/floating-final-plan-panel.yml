name: Floating final support plan panel

on:
  push:
    branches: [main]
    paths:
      - '.sync_script/floating_final_plan_panel.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply floating plan panel
        shell: bash
        run: |
          set -euo pipefail
          python .sync_script/floating_final_plan_panel.py
          grep -q 'sp-floating-panel' index_v3.0_minimal.html
          grep -q 'sp-floating-shell' index_v3.0_minimal.html
          grep -q 'sp-scheme-badge' index_v3.0_minimal.html
          grep -q 'sp-decision-box' index_v3.0_minimal.html
          rm -rf .sync_script
          rm -f .github/workflows/floating-final-plan-panel.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use floating final AOG plan panel'
          git push
