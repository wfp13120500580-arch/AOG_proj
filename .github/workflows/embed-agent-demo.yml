name: Embed Agent Demo
on:
  push:
    paths:
      - '.github/workflows/embed-agent-demo.yml'
permissions:
  contents: write
jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Embed right-side Agent demo
        run: python .github/scripts/embed_agent_demo.py
      - name: Commit result
        run: |
          git config user.name "AOG Demo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index_v3.0_minimal.html
          git diff --cached --quiet || git commit -m "feat: embed complete interactive Agent demo in main workbench"
          git push origin main
