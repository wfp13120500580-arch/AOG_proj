name: Highlight final support plan

on:
  push:
    branches: [main]
    paths:
      - '.sync_script/highlight_final_plan.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Highlight final support plan
        shell: bash
        run: |
          set -euo pipefail
          python .sync_script/highlight_final_plan.py
          grep -q 'wb-plan-hero' index_v3.0_minimal.html
          grep -q '核心决策' index_v3.0_minimal.html
          grep -q '最终保障方案' index_v3.0_minimal.html
          rm -rf .sync_script
          rm -f .github/workflows/highlight-final-plan.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Highlight final AOG support plan'
          git push
